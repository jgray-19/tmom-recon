default_install_hook_types: [pre-commit, commit-msg]

exclude: ^(\.codex|docs/_static/\.gitkeep|docs/_templates/\.gitkeep)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: trailing-whitespace
        exclude: ^tests/data/
      - id: end-of-file-fixer
        exclude: ^tests/data/
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-session-ids
        name: no AI session IDs in commit messages
        language: pygrep
        entry: '(?i)Claude-Session:|claude\.ai/code/session_'
        stages: [commit-msg]
