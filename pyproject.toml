[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tmom-recon"
version = "0.1.0"
description = "Transverse momentum reconstruction utilities"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "tfs-pandas",
    "omc3",
    "pymadng-utils",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "cpymad",
    "xtrack-tools",
]
dev = [
    "pre-commit>=4,<5",
    "ruff>=0.13,<0.14",
]
docs = [
    "sphinx>=8",
    "sphinx-rtd-theme>=3",
    "myst-parser>=4",
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["tmom_recon*"]

[tool.coverage.run]
source = ["src/tmom_recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["tests/data", "tests/experimental", "tests/kalman"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests that do not require a real accelerator model",
    "integration: marks tests that exercise an accelerator model or external physics engine",
    "diagnostic: marks one-hypothesis canonical reconstruction contracts",
    "campaign: marks long tracking and OMC3 measurement-generation tests",
    "regression: marks tests for previously observed failures",
    "psb: marks PSB-specific tests",
    "lhc: marks LHC-specific tests",
]
addopts = [
    "-p",
    "no:xdist",
    "--log-cli-level=INFO",
    "--log-level=INFO",
    "--log-cli-format=%(levelname)s %(name)s %(message)s",
    "--strict-markers",
    "-s",
    # "-n6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/data", "tests/kalman", "build", "scratch_tmp"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "RUF", "TC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclass: safe as an argument default.
extend-immutable-calls = ["tmom_recon.optics.OpticsInput"]
