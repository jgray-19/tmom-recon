[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tmom-recon"
version = "0.1.0"
description = "Transverse momentum reconstruction utilities"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "tfs-pandas",
    "omc3",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "cpymad",
]
dev = [
    "pre-commit",
    "xtrack-tools",
    "ruff",
]
docs = [
    "sphinx>=8",
    "sphinx-rtd-theme>=3",
    "myst-parser>=4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tmom_recon*"]

[tool.coverage.run]
source = ["src/tmom_recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["tests/data", "tests/experimental", "tests/kalman"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests that do not require a real accelerator model",
    "integration: marks tests that exercise an accelerator model or external physics engine",
    "diagnostic: marks one-hypothesis canonical reconstruction contracts",
    "campaign: marks long tracking and OMC3 measurement-generation tests",
    "regression: marks tests for previously observed failures",
    "psb: marks PSB-specific tests",
    "lhc: marks LHC-specific tests",
]
addopts = [
    "-p",
    "no:xdist",
    "--log-cli-level=INFO",
    "--log-level=INFO",
    "--log-cli-format=%(levelname)s %(name)s %(message)s",
    "--strict-markers",
    "-s",
    # "-n6",
]

[tool.ruff]
exclude = [
  ".eggs",
  ".git",
  ".mypy_cache",
  ".venv",
  "_build",
  "build",
  "dist",
  "tests/kalman",
]

target-version = "py311"

line-length = 100
indent-width = 4

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
ignore = [
  "E501",
  "FBT001",
  "FBT002",
  "PT019",
]
extend-select = [
    "F",
    "W",
    "E",
    "I",
    "A",
    "N",
    "UP",
    "C4",
    "FA",
    "FBT",
    "ISC",
    "BLE",
    "ICN",
    "RET",
    "SIM",
    "TID",
    "PTH",
    "NPY",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"study/0*.py" = ["N999"]
