name: Coverage

on:
  push:
    branches: ["**"]
  pull_request:

env:
  UV_COMPILE_BYTECODE: 1

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Everything cheap, plus any slow tests that are not machine-specific.
          - shard: general
            markers: >-
              not slow or
              (slow and not lhc and not psb)

          # Slow LHC integration tests.
          - shard: lhc
            markers: >-
              slow and lhc

          # Slow PSB integration tests.
          # Exclude LHC explicitly so a mistakenly dual-marked test
          # is still only executed once.
          - shard: psb
            markers: >-
              slow and psb and not lhc

    permissions:
      contents: write

    env:
      python-version: "3.13"

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.python-version }}
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: "pyproject.toml"

      - name: Ensure pip, setuptools and wheel
        run: uv pip install --upgrade pip setuptools wheel

      - name: Install package
        run: uv pip install '.[test]'

      - name: Install dependencies from GitHub
        run: |
          uv pip install \
            git+https://github.com/jgray-19/xtrack_tools.git \
            git+https://github.com/jgray-19/pymadng-utils.git

      - name: Run ${{ matrix.shard }} tests
        run: |
          pytest \
            -m "${{ matrix.markers }}" \
            --cov \
            --cov-branch \
            --cov-report=xml:coverage.xml

      - name: Upload ${{ matrix.shard }} coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          flags: ${{ matrix.shard }}
          name: ${{ matrix.shard }}
